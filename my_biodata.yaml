# --------------- IMAGES ---------------
# ==========================================
#  GANESHA EMBLEM CONTROL (top small emblem)
# ==========================================
# GaneshaMode controls what appears above the main title:
#   - om    : ALWAYS draw the "ॐ" symbol (requires a Devanagari font)
#   - image : ALWAYS use GaneshaImage PNG (if it loads)
#   - auto  : Use PNG if available; otherwise fallback to "ॐ"
Photo: my_photo.jpg          # Optional; if omitted, photo box stays empty
GaneshaMode: auto            # 'image' -> always PNG; 'om' -> always draw "ॐ"; 'auto' -> PNG if available else "ॐ"
GaneshaImage: ganesha.png    # Used when GaneshaMode is 'image' or 'auto' and file loads


# =================
#  BORDER STRIPS
# =================
# Put your decorative strip image(s) here.
# BorderMode:
#   - fit     : SCALE to full page width (no left/right cropping). Height auto-computed.
#   - stretch : Stretch to width & set height (distorts aspect). Uses BorderHeight.
#   - tile    : Scale to BorderHeight and tile across the width. Uses BorderHeight.# --- Borders (use your strip image full-width, no cropping) ---
BorderTop: my_border.png         # your strip image
# BorderBottom: my_bottom.png    # optional; if omitted, Top is reused
BorderMode: tile                  # IMPORTANT: scales to full page width, preserves aspect
BorderHeight: 32               # ignored in 'fit' mode
BorderFlipBottom: false          # keep same orientation at the bottom


# =============================
#  TEXT SIZES (no code changes)
# =============================
# Increase/decrease these to make text bigger/smaller.
# If the sizes don't change in output, specify valid .ttf files in the font section below.
HeadingSize: 20        # "|| SHREE GANESHAYA NAMAH ||"
SubheadingSize: 18     # "BIODATA"
LabelSize: 14          # "Name :", "Date of Birth :", etc.
SectionSize: 12        # "FAMILY DETAILS", "CONTACT DETAILS"
OmSize: 84             # Size of "ॐ" if drawn

# ===================================
#  FONT FILES (IMPORTANT for scaling)
# ===================================
# If these are missing, Pillow may fall back to a built-in bitmap font and
# your text sizes WON'T change (you'll also see WARN lines in the console).
# Provide real TTF paths. You can:
#   A) Place .ttf files in the project folder and reference them like "./DejaVuSans.ttf"
#   B) Point to installed system fonts (examples for Windows below)
#
# Windows examples:
FontRegular: "C:/Windows/Fonts/arial.ttf"
FontBold:    "C:/Windows/Fonts/arialbd.ttf"
FontDevanagari: "C:/Windows/Fonts/nirmala.ttf"

# Or drop TTFs alongside the script and reference them directly:
# FontRegular: "./DejaVuSans.ttf"
# FontBold: "./DejaVuSans-Bold.ttf"
# FontDevanagari: "./NotoSansDevanagari-Regular.ttf"

# Uncomment and set the following three lines to reliable .ttf files on your machine:
# FontRegular: "./DejaVuSans.ttf"
# FontBold: "./DejaVuSans-Bold.ttf"
# FontDevanagari: "./NotoSansDevanagari-Regular.ttf"
